volumes:
  - .:/app
ports:
  - "3000:3000"
environment:
  - NODE_ENV=development
  - DB_HOST=database
  - DB_PORT=3306
  - DB_USER=${DB_USER}
  - DB_PASSWORD=${DB_PASSWORD}
  - DB_NAME=${DB_NAME}

database:
  image: mysql:8.0
  environment:
    - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    - MYSQL_DATABASE=${DB_NAME}
    - MYSQL_USER=${DB_USER}
    - MYSQL_PASSWORD=${DB_PASSWORD}
  ports:
    - "3306:3306"